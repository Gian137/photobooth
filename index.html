<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapStrip Photobooth</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 { margin-bottom: 5px; font-size: 1.6rem; }
    p { color: #aaa; margin-top: 0; font-size: 0.9rem; }

    .booth-container {
      position: relative;
      width: 360px;
      max-width: 95%;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid #333;
    }

    .video-wrapper {
      width: 100%;
      height: 230px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      position: relative;
      border: 2px solid #2a2a2a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
      display: none;
      z-index: 10;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
      width: 100%;
    }

    button:hover { background: #005999; }
    button:disabled { background: #444; cursor: not-allowed; }

    .strip-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-selector {
      display: none;
      margin-top: 15px;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .theme-selector label {
      font-size: 0.85rem;
      color: #ddd;
      font-weight: 600;
    }

    .theme-selector select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      max-width: 100%;
    }

    .download-btn {
      margin-top: 12px;
      background: #28a745;
      display: none;
      text-decoration: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    .download-btn:hover { background: #218838; }
  </style>
</head>
<body>

  <h1>SnapStrip Photobooth</h1>
  <p>Take 3 snaps to build your photostrip!</p>

  <div class="booth-container">
    <div class="video-wrapper">
      <video id="video" autoplay playsinline></video>
      <div id="countdown" class="countdown-overlay">3</div>
    </div>
    <div class="controls">
      <button id="snap-btn" onclick="startPhotoStrip()">Take Photos (3x)</button>
    </div>
  </div>

  <div class="strip-container">
    <canvas id="canvas" width="270" height="620" style="display:none;"></canvas>
    
    <div id="theme-selector" class="theme-selector">
      <label for="frame-theme">Choose Frame Style:</label>
      <select id="frame-theme" onchange="changeTheme()">
        <option value="cats">🐱 Orange Tabby Cat</option>
        <option value="blue">Classic Blue Shade</option>
        <option value="red">Classic Red Shade</option>
        <option value="moonlight">Moonlight Night (Under The Stars)</option>
        <option value="beach">Sunny Beach (Summer Party)</option>
        <option value="vintage">Vintage Sepia (Film Strip)</option>
        <option value="white">Classic White</option>
        <option value="newspaper">Newspaper Press (Vintage Times)</option>
        <option value="checkered">Checkered Pink (Y2K Hearts)</option>
      </select>
    </div>

    <a id="download-link" class="download-btn" download="photostrip.png">Download Photo Strip</a>
  </div>

  <!-- 1. Load external cat script first -->
  <script src="catjava.js"></script>

  <!-- 2. Main Photobooth Script -->
  <script>
    const video = document.getElementById('video');
    const countdownEl = document.getElementById('countdown');
    const snapBtn = document.getElementById('snap-btn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadLink = document.getElementById('download-link');
    const themeSelector = document.getElementById('theme-selector');
    const frameThemeSelect = document.getElementById('frame-theme');

    // Make canvas & ctx globally available for catjava.js
    window.canvas = canvas;
    window.ctx = ctx;

    let currentPhotos = [];

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera access denied or not found!");
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startPhotoStrip() {
      snapBtn.disabled = true;
      currentPhotos = [];

      for (let i = 0; i < 3; i++) {
        if (i > 0) {
          countdownEl.textContent = "Get Ready!";
          countdownEl.style.fontSize = "1.3rem";
          countdownEl.style.display = 'block';
          await sleep(1500);
          countdownEl.style.fontSize = "4rem";
        }

        for (let c = 3; c > 0; c--) {
          countdownEl.textContent = c;
          countdownEl.style.display = 'block';
          await sleep(800);
        }
        countdownEl.style.display = 'none';

        const tempCanvas = document.createElement('canvas');
        const targetWidth = 400;
        const targetHeight = 260; 
        tempCanvas.width = targetWidth;
        tempCanvas.height = targetHeight;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);

        const vWidth = video.videoWidth || 640;
        const vHeight = video.videoHeight || 480;

        const targetAspect = targetWidth / targetHeight;
        const videoAspect = vWidth / vHeight;

        let sourceX = 0, sourceY = 0, sourceWidth = vWidth, sourceHeight = vHeight;

        if (videoAspect > targetAspect) {
          sourceWidth = vHeight * targetAspect;
          sourceX = (vWidth - sourceWidth) / 2;
        } else {
          sourceHeight = vWidth / targetAspect;
          sourceY = (vHeight - sourceHeight) / 2;
        }

        tempCtx.drawImage(
          video,
          sourceX, sourceY, sourceWidth, sourceHeight,
          0, 0, targetWidth, targetHeight
        );
        
        currentPhotos.push(tempCanvas);
      }

      renderPhotostrip();
      snapBtn.disabled = false;
    }

    function changeTheme() {
      if (currentPhotos.length > 0) {
        renderPhotostrip();
      }
    }

    function drawCheckeredPattern(color1, color2, squareSize) {
      for (let y = 0; y < canvas.height; y += squareSize) {
        for (let x = 0; x < canvas.width; x += squareSize) {
          ctx.fillStyle = ((x / squareSize + y / squareSize) % 2 === 0) ? color1 : color2;
          ctx.fillRect(x, y, squareSize, squareSize);
        }
      }
    }

    function drawGridBackground(color1, gridColor, gridSize) {
      ctx.fillStyle = color1;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 0.8;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawFrameBackground(theme) {
      switch (theme) {
        case 'cats':
          drawGridBackground('#fbf3eb', '#ebdcd0', 14);
          if (typeof window.drawCalicoCatHeader === 'function') {
            window.drawCalicoCatHeader();
          }
          break;

        case 'blue':
          const blueGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          blueGrad.addColorStop(0, '#5390d9');
          blueGrad.addColorStop(1, '#0b2038');
          ctx.fillStyle = blueGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          break;

        case 'red':
          const redGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          redGrad.addColorStop(0, '#ff4d4d');
          redGrad.addColorStop(1, '#5c0000');
          ctx.fillStyle = redGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          break;

        case 'moonlight':
          const moonGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          moonGrad.addColorStop(0, '#0a1128');
          moonGrad.addColorStop(0.5, '#1c2541');
          moonGrad.addColorStop(1, '#0b132b');
          ctx.fillStyle = moonGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          for (let i = 0; i < 45; i++) {
            const rx = (Math.sin(i * 99) * 0.5 + 0.5) * canvas.width;
            const ry = (Math.cos(i * 33) * 0.5 + 0.5) * canvas.height;
            const rSize = (i % 3 === 0) ? 1.8 : 1;
            ctx.beginPath(); ctx.arc(rx, ry, rSize, 0, Math.PI * 2); ctx.fill();
          }
          break;

        case 'beach':
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.font = '12px sans-serif';
          ctx.fillText('🍍', 8, 25); ctx.fillText('🌴', canvas.width - 20, 25);
          ctx.fillText('🥥', 8, canvas.height - 25); ctx.fillText('🌺', canvas.width - 22, canvas.height - 25);
          break;

        case 'vintage':
          ctx.fillStyle = '#a3a89e';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const filmX = 20, filmWidth = canvas.width - 40;
          ctx.fillStyle = '#111111';
          ctx.fillRect(filmX, 0, filmWidth, canvas.height);
          ctx.fillStyle = '#a3a89e';
          for (let y = 10; y < canvas.height; y += 18) {
            ctx.fillRect(filmX + 6, y, 7, 10);
            ctx.fillRect(filmX + filmWidth - 13, y, 7, 10);
          }
          break;

        case 'newspaper':
          ctx.fillStyle = '#e8e4d9';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 3;
          ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
          ctx.fillStyle = '#111';
          ctx.font = 'bold 22px "Times New Roman", Georgia, serif';
          ctx.textAlign = 'center';
          ctx.fillText("The Daily Times", canvas.width / 2, 32);
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(15, 38); ctx.lineTo(canvas.width - 15, 38); ctx.stroke();
          ctx.font = 'italic 8.5px "Times New Roman", serif';
          ctx.fillText(`VOL. I ... NO. 1      ${new Date().toLocaleDateString().toUpperCase()}      SPECIAL EDITION`, canvas.width / 2, 47);
          ctx.beginPath(); ctx.moveTo(15, 52); ctx.lineTo(canvas.width - 15, 52); ctx.stroke();
          break;

        case 'checkered':
          drawCheckeredPattern('#1e1e1e', '#ffb6c1', 12);
          ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
          ctx.fillRect(10, 5, canvas.width - 20, canvas.height - 10);
          break;

        case 'white':
        default:
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          break;
      }
    }

    function drawScallopedFrame(x, y, w, h) {
      ctx.save();
      ctx.beginPath();
      const bumpsX = 10, bumpsY = 7;
      const stepX = w / bumpsX, stepY = h / bumpsY;

      ctx.moveTo(x, y);
      for (let i = 0; i < bumpsX; i++) {
        ctx.quadraticCurveTo(x + (i + 0.5) * stepX, y - 5, x + (i + 1) * stepX, y);
      }
      for (let i = 0; i < bumpsY; i++) {
        ctx.quadraticCurveTo(x + w + 5, y + (i + 0.5) * stepY, x + w, y + (i + 1) * stepY);
      }
      for (let i = bumpsX; i > 0; i--) {
        ctx.quadraticCurveTo(x + (i - 0.5) * stepX, y + h + 5, x + (i - 1) * stepX, y + h);
      }
      for (let i = bumpsY; i > 0; i--) {
        ctx.quadraticCurveTo(x - 5, y + (i - 0.5) * stepY, x, y + (i - 1) * stepY);
      }
      ctx.closePath();

      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#3a1f0d';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    function renderPhotostrip() {
      const selectedTheme = frameThemeSelect.value;
      
      ctx.restore();
      drawFrameBackground(selectedTheme);

      let sideMargin = 25;
      let footerMargin = 55;
      let topHeaderOffset = (selectedTheme === 'cats') ? 110 : ((selectedTheme === 'newspaper') ? 60 : 18);
      let photoGap = 14;

      if (selectedTheme === 'vintage') {
        sideMargin = 40;
        topHeaderOffset = 22;
        footerMargin = 30;
        photoGap = 16;
      }

      const photoWidth = canvas.width - (sideMargin * 2);
      const totalAvailableHeight = canvas.height - topHeaderOffset - footerMargin;
      const photoHeight = Math.floor((totalAvailableHeight - (photoGap * 2)) / 3);

      currentPhotos.forEach((photoCanvas, index) => {
        const yOffset = topHeaderOffset + (index * (photoHeight + photoGap));
        
        ctx.save();

        if (selectedTheme === 'cats') {
          drawScallopedFrame(sideMargin, yOffset, photoWidth, photoHeight);
          ctx.beginPath();
          ctx.rect(sideMargin + 2, yOffset + 2, photoWidth - 4, photoHeight - 4);
          ctx.clip();
        } else if (selectedTheme === 'blue' || selectedTheme === 'red') {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(sideMargin - 1, yOffset - 1, photoWidth + 2, photoHeight + 2);
        } else if (selectedTheme === 'moonlight') {
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 3;
          ctx.strokeRect(sideMargin - 1, yOffset - 1, photoWidth + 2, photoHeight + 2);
        } else if (selectedTheme === 'newspaper') {
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 2;
          ctx.strokeRect(sideMargin - 1, yOffset - 1, photoWidth + 2, photoHeight + 2);
          ctx.filter = 'grayscale(100%) contrast(110%)';
        } else {
          ctx.strokeStyle = 'rgba(0,0,0,0.18)';
          ctx.lineWidth = 1;
          ctx.strokeRect(sideMargin - 1, yOffset - 1, photoWidth + 2, photoHeight + 2);
        }

        ctx.drawImage(photoCanvas, sideMargin, yOffset, photoWidth, photoHeight);
        ctx.restore();
      });

      // --- FOOTER & DECORATIONS ---
      if (selectedTheme === 'cats') {
        ctx.fillStyle = '#e57e25';
        ctx.font = 'bold 16px "Comic Sans MS", cursive, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("🐾 TABBY SNAPS 🐾", canvas.width / 2, canvas.height - 25);
      } else if (selectedTheme === 'blue') {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("SHADE OF BLUE", canvas.width / 2, canvas.height - 30);
      } else if (selectedTheme === 'red') {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("SHADE OF RED", canvas.width / 2, canvas.height - 30);
      } else if (selectedTheme !== 'vintage') {
        ctx.fillStyle = '#111111';
        ctx.font = 'bold 11px "Times New Roman", Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(new Date().toLocaleDateString(), canvas.width / 2, canvas.height - 18);
      }

      canvas.style.display = 'block';
      themeSelector.style.display = 'flex';
      downloadLink.href = canvas.toDataURL('image/png');
      downloadLink.style.display = 'inline-block';
    }

    initCamera();
  </script>
</body>
</html>
